name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build
        env:
          # Set repo variable VITE_SOCKET_URL (Settings → Secrets and variables
          # → Actions → Variables) to the persistent socket-server URL, e.g.
          # https://chess-world.onrender.com — the Tavern lobby connects there.
          # Unset = same-origin (local dev behavior).
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
